name: Secret scan

# Gitleaks over the full git history on every PR and push to main. A leaked
# credential stays leaked after the commit that removed it, so the scan walks
# every commit reachable from HEAD rather than just the diff.
#
# The scan body lives in the org's shared workflow rather than inline here —
# see Lurking-Walrus/.github-private/.github/workflows/secret-scan.yml for the
# rationale (architecture-aware install, checksum-verified download, no
# passwordless sudo on the fleet). This caller only supplies the job id that
# becomes the required-check prefix.
#
# Non-required for now: this repo is part of the initial rollout and the
# allowlist backing it has little production evidence yet. Promote
# "secret-scan / Gitleaks (full history)" to a required check once this repo
# has a track record of clean (or correctly allowlisted) runs.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  should-run:
    name: Determine whether checks are required
    runs-on: ${{ fromJSON(vars.USE_SELF_HOSTED_RUNNER == 'true' && github.event.repository.private && '["self-hosted","Linux"]' || '["ubuntu-latest"]') }}
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.dedupe.outputs.run }}
    steps:
      - id: dedupe
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.eventName !== "push") {
              core.setOutput("run", "true");
              return;
            }

            try {
              const { data: pullRequests } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                commit_sha: context.sha,
              });
              const targetBranch = context.ref.replace("refs/heads/", "");
              const wasMergedPullRequest = pullRequests.some(
                (pullRequest) => pullRequest.merged_at && pullRequest.base.ref === targetBranch,
              );
              core.setOutput("run", String(!wasMergedPullRequest));
            } catch (error) {
              core.warning(`Could not identify an associated pull request: ${error}`);
              core.setOutput("run", "true");
            }

  # This job's NAME becomes the status-check prefix: the reusable workflow's
  # "Gitleaks (full history)" job reports as "secret-scan / Gitleaks (full
  # history)". Held identical org-wide so a future required-check ruleset can
  # use one literal string across every repo.
  secret-scan:
    uses: Lurking-Walrus/.github-private/.github/workflows/secret-scan.yml@e1cc9c58f26dcd03b1bebbb4f1fd6ac5f278cc95 # main
    needs: should-run
    if: needs.should-run.outputs.run == 'true'
